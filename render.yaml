services:
  - type: web
    name: cake-walk
    runtime: node
    plan: free
    buildCommand: npm exec --yes --package=pnpm@12.21.0 -- pnpm install --frozen-lockfile --prod=false && npm exec --yes --package=pnpm@12.21.0 -- pnpm build
    startCommand: cd packages/server && ./node_modules/.bin/tsx src/main.ts
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
